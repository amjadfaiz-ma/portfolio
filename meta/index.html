<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meta</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <header>
    <h1>Meta</h1>
    <p>This page includes stats about the code of this website.</p>
  </header>

  <main>
    <!-- Step 1.1: Slider UI for commit filtering -->
    <div id="time-filter" style="display: flex; align-items: baseline; gap: 1rem; margin-bottom: 1rem;">
      <label for="commit-progress">Show commits until:</label>
      <input type="range" id="commit-progress" min="0" max="100" value="100">
      <time id="commit-time" style="margin-left: auto;">Loading...</time>
    </div>

    <!-- Placeholder for summary stats -->
    <div id="stats"></div>
    
    <div id="scrolly-1">

      <div id="scatter-story">
        <!-- Step text will be injected by JS -->
      </div>

      <div id="scatter-plot">
        <h2>Commits by time of day</h2>
        <div id="chart"></div>

        <!-- Brush outputs stay inside the sticky section -->
        <p id="selection-count">No commits selected</p>
        <dl id="language-breakdown" class="stats"></dl>
      </div>

    </div>
    
    <!-- Step 3: tooltip for hovered commit -->
    <dl id="commit-tooltip" class="info tooltip" hidden>
    <dt>Commit</dt>
    <dd>
        <a href="" id="commit-link" target="_blank" rel="noreferrer"></a>
    </dd>

    <dt>Date</dt>
    <dd id="commit-date"></dd>

    <dt>Time</dt>
    <dd id="commit-time"></dd>

    <dt>Author</dt>
    <dd id="commit-author"></dd>

    <dt>Lines edited</dt>
    <dd id="commit-lines"></dd>
    </dl>

    <!-- Step 2: file unit visualization -->
    <dl id="files">
      <!-- populated by D3 -->
    </dl>
  </main>

  <!-- Global navigation -->
  <script type="module" src="../global.js"></script>

  <!-- D3 logic for CSV loading -->
  <script type="module" src="main.js"></script>
</body>
</html>
