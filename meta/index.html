<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meta</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <header>
    <h1>Meta</h1>
    <p>This page includes stats about the code of this website.</p>
  </header>

  <main>
    <!-- Summary stats -->
    <div id="stats"></div>

    <!-- Scrollytelling Part 1: commits over time -->
    <div id="scrolly-1">
      <div id="scatter-story">
        <!-- Commit narrative steps injected by JS -->
      </div>

      <div id="scatter-plot">
        <h2>Commits by time of day</h2>
        <div id="chart"></div>

        <!-- Brush outputs stay inside the sticky section -->
        <p id="selection-count">No commits selected</p>
        <dl id="language-breakdown" class="stats"></dl>
      </div>
    </div>

    <!-- Tooltip for hovered commit -->
    <dl id="commit-tooltip" class="info tooltip" hidden>
      <dt>Commit</dt>
      <dd>
        <a href="" id="commit-link" target="_blank" rel="noreferrer"></a>
      </dd>

      <dt>Date</dt>
      <dd id="commit-date"></dd>

      <dt>Time</dt>
      <dd id="commit-time"></dd>

      <dt>Author</dt>
      <dd id="commit-author"></dd>

      <dt>Lines edited</dt>
      <dd id="commit-lines"></dd>
    </dl>

    <!-- Scrollytelling Part 2: file sizes / unit visualization -->
    <div id="scrolly-2">
      <div id="files-story">
        <!-- File-size narrative steps injected by JS -->
      </div>

      <div id="files-plot">
        <h2>Evolution of File Sizes</h2>
        <dl id="files">
          <!-- File unit visualization populated by JS -->
        </dl>
      </div>
    </div>
  </main>

  <!-- Global navigation -->
  <script type="module" src="../global.js"></script>

  <!-- D3 + Scrollama logic for meta page -->
  <script type="module" src="main.js"></script>
</body>
</html>
